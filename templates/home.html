<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance Charge Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="app-shell">
    <section class="hero-panel">
      <div class="hero-copy">
        <p class="eyebrow">Insurance prediction, reimagined</p>
        <h1>Estimate insurance charges in <span>₦</span> with accuracy</h1>
        <p class="hero-text">Use this clean UI to forecast medical insurance cost in Nigerian Naira.</p>
      </div>
      <div class="hero-card">
        <div class="card-header">
          <span>Model input</span>
          <strong>FastAPI + PyCaret</strong>
        </div>
        <form action="/predict" method="POST" class="form-grid">
          <label>
            <span>Age</span>
            <input type="number" name="age" min="18" placeholder="Enter age" required>
          </label>
          <label>
            <span>Sex</span>
            <input type="text" name="sex" placeholder="male or female" required>
          </label>
          <label>
            <span>BMI</span>
            <input type="number" step="0.1" name="bmi" placeholder="e.g. 27.9" required>
          </label>
          <label>
            <span>Children</span>
            <input type="number" name="children" min="0" placeholder="Number of dependents" required>
          </label>
          <label>
            <span>Smoker</span>
            <input type="text" name="smoker" placeholder="yes or no" required>
          </label>
          <label>
            <span>Region</span>
            <input type="text" name="region" placeholder="southwest" required>
          </label>
          <button type="submit" class="button-primary">Calculate in ₦</button>
        </form>
      </div>
    </section>
  </div>

  <div class="prediction-modal" data-prediction="{{ pred or '' }}">
    <div class="modal-card">
      <button class="modal-close" type="button" aria-label="Close prediction popup">×</button>
      <span class="modal-badge">Prediction ready</span>
      <h2>Estimated insurance charge</h2>
      <p class="modal-value"></p>
      <p class="modal-description">This value is based on the inputs you submitted.</p>
      <button class="button-primary modal-action" type="button">Close</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const modal = document.querySelector('.prediction-modal');
      if (!modal) return;
      const prediction = modal.dataset.prediction?.trim();
      if (prediction) {
        const cleanPrediction = prediction.replace(/^₦?\s*Expected\s+Bill\s+will\s+be\s*/i, '').trim();
        modal.querySelector('.modal-value').textContent = cleanPrediction;
        modal.classList.add('visible');
      }
      const closeButtons = modal.querySelectorAll('.modal-close, .modal-action');
      closeButtons.forEach(button => {
        button.addEventListener('click', () => {
          modal.classList.remove('visible');
        });
      });
    });
  </script>
</body>
</html>
